# Sync: copy new or changed source files into R2 (tiers 1 and 2), load them into Databricks bronze, build silver with a
# Databricks job (only when bronze loaded something new), redeploy the app so it shows the new data, then tell Slack.
# It polls once an hour from 14:00 to 23:00 UTC, because the source publishes at a different time each day (seen 13:50 to
# 15:50 UTC). Most polls find nothing new and stop after bronze (about 2 minutes). The 22:17 UTC run always builds silver, as a
# safety net. A poll also builds silver when the previous sync run failed, so a failed silver build is retried within the hour
# instead of waiting for the 22:17 run (bronze would show "nothing new" on that next poll, because it had already loaded).
# Scheduled runs only work from the default branch (main).
name: daily-sync

on:
  schedule:
    - cron: "17 14-21,23 * * *"   # hourly at :17 UTC. Off the top of the hour because GitHub delays busy slots (seen: up to 4 hours)
    - cron: "17 22 * * *"         # the daily safety-net run: always builds silver (see "Decide" below)
  workflow_dispatch:               # manual "Run workflow" button
    inputs:
      force_silver:
        description: "Build silver even if bronze loaded nothing new (untick to test the nothing-new path)"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write            # only so the last step can start the deploy-app workflow

concurrency:
  group: daily-sync          # never two syncs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GITHUB_TOKEN: ${{ github.token }}   # only used to read the public release list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Sync tier 1
        id: tier1
        shell: bash
        run: python scripts/backfill.py --tier tier1 --execute 2>&1 | tee tier1.log

      - name: Sync tier 2
        id: tier2
        if: ${{ !cancelled() }}   # still try tier 2 if tier 1 failed
        shell: bash
        run: python scripts/backfill.py --tier tier2 --execute 2>&1 | tee tier2.log

      # Bronze only runs when both syncs succeeded, so it never loads from a half-finished sync.
      - uses: databricks/setup-cli@v1.24.0
        if: ${{ steps.tier1.outcome == 'success' && steps.tier2.outcome == 'success' }}
        with:
          version: 1.24.0

      - name: Load bronze
        id: bronze
        if: ${{ steps.tier1.outcome == 'success' && steps.tier2.outcome == 'success' }}
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python scripts/bronze_load.py --execute 2>&1 | tee bronze.log

      # Did bronze load anything new? bronze_load.py prints "Files: N | CHANGED: x, UNCHANGED: y"; no CHANGED word means
      # nothing changed. Silver is built when something changed, when the previous sync run failed (retry), on the 22:17 UTC
      # run, or on a manual run with force_silver on.
      - name: Decide whether to build silver
        id: decide
        if: ${{ steps.bronze.outcome == 'success' }}
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force_silver }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(grep -h '^Files:' bronze.log | grep -oE '\bCHANGED: [0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          changed=${changed:-0}
          build=false; why="bronze loaded nothing new"
          if [ "$changed" -gt 0 ]; then build=true; why="bronze changed $changed file(s)"; fi
          # Retry: the most recent FINISHED run of this workflow (this run is still going, so it is not counted) failed.
          # If the lookup itself fails, do not retry (the 22:17 run is the backstop).
          last=$(gh run list --workflow daily-sync.yml --status completed --limit 1 --json conclusion -q '.[0].conclusion' 2>/dev/null || true)
          retry=false
          if [ "$last" = "failure" ]; then retry=true; build=true; why="the previous sync run failed, so retrying the silver build"; fi
          if [ "$SCHEDULE" = "17 22 * * *" ]; then build=true; why="the daily 22:17 UTC run always builds silver"; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then build=true; why="manual run with force_silver on"; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          echo "Build silver: $build ($why)"
          echo "$why" > decide.txt

      # Silver runs only after bronze succeeded and the step above said yes. Deploy first so the job always runs this
      # commit's code, then run the job and wait for it; a failed gate fails the job and so this step.
      - name: Build silver (Databricks job)
        id: silver
        if: ${{ steps.decide.outputs.build == 'true' }}
        shell: bash
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy 2>&1 | tee silver.log
          databricks bundle run silver_build 2>&1 | tee -a silver.log

      - name: Build summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Daily sync"
            for t in tier1 tier2; do
              echo "- $t: $(grep -h '^Files:' $t.log 2>/dev/null || echo 'did not finish')"
            done
            echo "- bronze: $(grep -h '^Files:' bronze.log 2>/dev/null || echo 'did not run')"
            if [ -f silver.log ]; then
              echo "- silver: $(grep -h '^Changed this run' silver.log 2>/dev/null || echo 'did not finish')"
            elif [ -f decide.txt ]; then
              echo "- silver: skipped ($(cat decide.txt))"
            else
              echo "- silver: did not run"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > summary.txt

      # New data is in the gold tables, so redeploy the app now instead of waiting for its own 6-hourly run. Only when
      # something changed, or this run was a retry of a failed build (its gold tables are new too), and silver succeeded. A failure here must not turn a good sync red: the scheduled deploy is the backstop.
      - name: Redeploy the app
        if: ${{ steps.silver.outcome == 'success' && (steps.decide.outputs.changed != '0' || steps.decide.outputs.retry == 'true') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-app.yml --ref main

      - name: Tell Slack
        if: ${{ !cancelled() }}
        continue-on-error: true   # a Slack problem must not turn a good sync red
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "No SLACK_WEBHOOK_URL secret; skipping Slack."; exit 0; fi
          if [ "$JOB_STATUS" = "success" ]; then head="NBA daily sync OK"; else head="NBA daily sync FAILED"; fi
          HEAD="$head" python - <<'PY' > payload.json
          import json, os
          text = f"*{os.environ['HEAD']}*\n{open('summary.txt').read()}\n<{os.environ['RUN_URL']}|Open the run>"
          print(json.dumps({"text": text}))
          PY
          curl -fsS -X POST -H 'Content-type: application/json' --data @payload.json "$SLACK_WEBHOOK_URL"
