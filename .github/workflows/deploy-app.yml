# Deploy the "Player form" app (a Databricks App) from main. It runs:
#   - when a change under app/ (or this file) lands on main, i.e. after the owner merges a pull request;
#   - twice a day, because Databricks Free Edition stops an app about 24 hours after its last deploy and a fresh deploy
#     keeps it running (GitHub may start scheduled runs hours late, so twice a day leaves a safe margin);
#   - from the "Run workflow" button.
# It only ever deploys main (scheduled runs use main by themselves; a button run from another branch is refused), and it
# checks the app first: type check, lint, tests and the build must all pass or nothing is deployed.
# It needs the DATABRICKS_HOST and DATABRICKS_TOKEN secrets (the same two the daily sync uses). It prints no secret.
name: deploy-app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-app.yml"]
  schedule:
    - cron: "41 3,15 * * *"   # off the top of the hour; times in UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app          # never two deploys at once
  cancel-in-progress: false

env:
  APP_NAME: nba-player-form
  APP_PATH: /Workspace/Users/dbx.nba@gmail.com/apps/nba-player-form

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the app (types, lint, tests, build)
        working-directory: app
        run: |
          npm ci
          npx tsc -b
          npx oxlint
          npm test
          npm run build

      - uses: databricks/setup-cli@v1.24.0
        with:
          version: 1.24.0

      # The app's own build runs on Databricks, so the folder sent is the source only (no node_modules, no dist, no .env).
      - name: Upload the app source
        run: |
          mkdir -p "$RUNNER_TEMP/appstage"
          rsync -a --exclude node_modules --exclude dist --exclude .env app/ "$RUNNER_TEMP/appstage/"
          databricks workspace import-dir "$RUNNER_TEMP/appstage" "$APP_PATH" --overwrite

      - name: Start the app if it is stopped
        run: |
          state=$(databricks apps get "$APP_NAME" -o json | python3 -c 'import sys,json; print(json.load(sys.stdin)["compute_status"]["state"])')
          echo "App compute state: $state"
          if [ "$state" != "ACTIVE" ]; then databricks apps start "$APP_NAME"; fi

      - name: Deploy
        run: |
          set -o pipefail
          databricks apps deploy "$APP_NAME" --source-code-path "$APP_PATH" -o json | tee deploy.json

      - name: Confirm the deploy worked
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("deploy.json"))
          state = d["status"]["state"]
          print("deployment", d["deployment_id"], state, "-", d["status"]["message"])
          raise SystemExit(0 if state == "SUCCEEDED" else 1)
          PY
          databricks apps get "$APP_NAME" -o json | python3 -c 'import sys,json; d=json.load(sys.stdin); print("app:", d["app_status"]["state"], "| compute:", d["compute_status"]["state"]); sys.exit(0 if d["app_status"]["state"]=="RUNNING" else 1)'
          {
            echo "### Deploy app"
            echo "- $(python3 -c 'import json; d=json.load(open("deploy.json")); print("deployment", d["deployment_id"], d["status"]["state"])')"
            echo "- from commit ${GITHUB_SHA::7}"
          } >> "$GITHUB_STEP_SUMMARY"
